<style>:root{--bg:#fff;--fg:#000;--mut:#333;--line:#999;--bar:#ddd;--link:#0040a0;--ok:#0a7d2c;--err:#a00;--warn:#b36b00;--pickbg:#fff8ec;--hi:#fff3a0;color-scheme:light}

*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg)}

.dayh{margin-top:22px}.today{border-width:4px;border-color:var(--ok)}.todayh{color:var(--ok)}.cookd{color:var(--ok);font-weight:700}

</div></div>

 {const nr=Object.keys(S.removed).filter(k=>S.removed[k]).length;$("reset").hidden=!nr;$("reset").textContent="Restore removed items ("+nr+")";$("bM").innerHTML=nr?'<b class="bdg">'+nr+"</b>":"";}if(typeof DEV!=="undefined"){recipes();extras();}}

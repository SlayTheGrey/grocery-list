<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Grocery List</title><meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff;color:#000}

.box{width:32px;height:32px;border:3px solid #000;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.done .box{background:#0a7d2c;border-color:#0a7d2c;color:#fff}.done .nm{text-decoration:line-through;color:#555}
.nm{flex:1}.qp{font-size:16px;color:#222;text-align:right;white-space:nowrap}
.lnk{flex:none;font-size:15px;font-weight:700;color:#0040a0;border:2px solid #0040a0;border-radius:999px;padding:8px 10px;margin-left:4px;text-decoration:none;white-space:nowrap}

.bud{font-size:18px}.over{color:#a00;font-weight:700}
</style></head><body>
<header><h1 id="ttl">Weekly Grocery List</h1><div class="sub" id="dates"></div>
<div class="tabs"><button id="tL" class="on">List</button><button id="tR">Recipes</button><button id="tC">Chat</button></div></header>
<main><section id="list">
<div class="ls"><button class="btn" id="lThis">This week</button><button class="btn" id="lNext">Next week</button></div>
<div id="picks"></div>
<div class="card"><b>Ask assistant to add</b><input id="xt" placeholder="e.g. 2 bags shredded cheese">
<div class="tools"><label class="btn" for="xf">📷 Photo</label><input id="xf" type="file" accept="image/*" capture="environment" hidden><img id="thumb" alt="photo preview">
<select id="xl" style="flex:1;width:auto"><option value="this">This week</option><option value="next">Next week</option></select></div>
<button class="btn" id="xs" style="width:100%">Send to assistant</button><div id="xst"></div></div>
<div id="prog" style="font-weight:700"></div><div id="sync" class="meta"></div><div class="bar"><i id="pb"></i></div>
<div class="tools"><button class="btn" id="mode">View: Category</button><button class="btn" id="hide">Hide checked</button><button class="btn" id="sink">Checked to bottom</button><button class="btn" id="clear">Clear checks</button></div>
<div id="cats"></div><div class="total" id="tot"></div>
<form id="add"><b>Add an item</b><input id="an" placeholder="Item name" required>
<div class="row"><input id="aq" placeholder="Qty" inputmode="numeric"><select id="ac"></select></div>
<input id="ap" placeholder="Price each (optional, e.g. 2.99)" inputmode="decimal"><button class="btn">Add item</button></form>
<button class="btn" id="reset" style="width:100%">Restore removed items</button>
</section><section id="recipes" hidden><div class="ls"><button class="btn" id="rThis">This week</button><button class="btn" id="rNext">Next week</button></div><div id="rpicks"></div><div id="rlist"></div></section>
<section id="chat" hidden><div class="card"><b>Message the assistant</b><textarea id="ct" placeholder="Add, remove or change items or recipes"></textarea>
<div class="ls"><select id="cl"><option value="this">This week</option><option value="next">Next week</option></select><button class="btn" id="cs">Send</button></div></div>
<div id="msgs"></div>
<details><summary>Settings</summary><div><p class="meta">Family PIN (stored only on this phone).</p><input id="key" type="password" autocomplete="off" placeholder="Family PIN" inputmode="numeric"><div class="tools"><button class="btn" id="ksave">Save PIN</button><button class="btn" id="kclr">Forget PIN</button></div><div id="kst" class="meta"></div></div></details></section></main>
<div id="modal" role="dialog" aria-modal="true"><div id="mbody"></div></div><div id="toast"><span id="tm"></span><button id="undo">Undo</button></div>
<script src="data.js"></script><script>
let W=window.WEEK;const CATS=["Fruits & Veggies","Meat & Seafood","Dairy","Frozen Foods","Sauces & Spices","Snacks & Beverages","Breads & Grains","Other"],
ROUTE=["Other","Fruits & Veggies","Breads & Grains","Meat & Seafood","Dairy","Sauces & Spices","Snacks & Beverages","Frozen Foods"],
$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K="grocery:"+W.weekId;let S=Object.assign({checked:{},added:[],removed:{},hide:false,sink:true,route:false,list:"this",chosen:{},cancelled:{},msgs:[]},JSON.parse(localStorage.getItem(K)||"{}"));
for(const k in localStorage)if(k.startsWith("grocery:")&&k!==K)localStorage.removeItem(k);
const save=()=>localStorage.setItem(K,JSON.stringify(S));

$("ac").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
const nx=()=>S.list==="next";const curCats=()=>nx()?((W.nextWeek&&W.nextWeek.categories)||[]):W.categories;
function items(){const a=[],p=nx()?"n:":"g:";curCats().forEach(c=>(c.items||[]).forEach((it,i)=>a.push({...it,cat:CATS.includes(c.name)?c.name:"Other",id:p+c.name+":"+i})));
 S.added.filter(it=>(it.list||"this")===S.list).forEach(it=>a.push(it));return a.filter(it=>!S.removed[it.id]);}
const lnk=i=>{const u=i.url||("https://www.walmart.com/search?q="+encodeURIComponent(i.name)),real=i.url&&i.urlType!=="search"&&/walmart\.com\/ip\//.test(i.url);return `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener" aria-label="${real?"Walmart product page":"Search Walmart"} for ${esc(i.name)}">${real?"Walmart":"Search"} ↗</a>`};
const money=n=>"$"+n.toFixed(2);
function render(){$("ttl").textContent=W.title;$("dates").textContent=(nx()?(W.nextWeek&&W.nextWeek.dates)||"Next week":W.dates)||"";$("lThis").classList.toggle("on",!nx());$("rThis")&&($("rThis").classList.toggle("on",!nx()),$("rNext").classList.toggle("on",nx()));$("lNext").classList.toggle("on",nx());renderPicks();
 const all=items(),done=all.filter(i=>S.checked[i.id]).length;
 $("prog").textContent=`${done} of ${all.length} in cart`;$("pb").style.width=(all.length?done/all.length*100:0)+"%";
 $("hide").classList.toggle("on",S.hide);$("sink").classList.toggle("on",S.sink);$("mode").textContent="View: "+(S.route?"Store route":"Category");$("mode").classList.toggle("on",S.route);
 let h="";for(const c of (S.route?ROUTE:CATS)){let its=all.filter(i=>i.cat===c);
  its.sort((a,b)=>(a.aisle&&b.aisle?String(a.aisle).localeCompare(String(b.aisle),undefined,{numeric:true}):a.aisle?-1:b.aisle?1:0)||(S.sink?(!!S.checked[a.id])-(!!S.checked[b.id]):0));
  const vis=S.hide?its.filter(i=>!S.checked[i.id]):its;
  h+=`<h2>${c}</h2>`;if(!its.length)h+=`<div class="empty">None this week</div>`;else if(!vis.length)h+=`<div class="empty">All in cart ✓</div>`;
  for(const i of vis){const d=S.checked[i.id],q=i.qty?"×"+esc(i.qty):"",p=i.price!=null?money(i.price*(+i.qty||1)):"";
   h+=`<div class="item${d?" done":""}"><button class="chk" data-c="${esc(i.id)}" aria-pressed="${!!d}"><span class="box">${d?"✓":""}</span><span class="nm">${esc(i.name)}${i.aisle?` <small>(${esc(i.aisle)})</small>`:""}</span><span class="qp">${q}<br>${p}</span></button>${lnk(i)}<button class="rm" data-r="${esc(i.id)}" aria-label="Remove ${esc(i.name)}">✕</button></div>`;}}
 $("cats").innerHTML=h;
 let food=0,soda=0,unk=0,pl=0,ua=0;all.forEach(i=>{if(i.price==null){unk++;return}const v=i.price*(+i.qty||1);i.soda?soda+=v:food+=v;(i.addedBy==="user"||String(i.id).startsWith("u:"))?ua+=v:pl+=v});
 const disc=Math.min(W.discount||0,food),sub=food+soda-disc,ft=Math.round((food-disc)*W.foodTaxRate*100)/100,st=Math.round(soda*W.sodaTaxRate*100)/100;
 const B=(nx()?(W.nextWeek&&W.nextWeek.budget):null)||W.budget||200;
 $("tot").innerHTML=`<div class="bud">Planned (budget ${money(B)}): <b class="${pl>B?"over":""}">${money(pl)}</b><br>Your additions: <b>${money(ua)}</b></div><small>Before tax.</small><hr>Subtotal ${money(sub)}${disc?` (after ${money(disc)} rollback)`:""}<br>Food tax ${(W.foodTaxRate*100).toFixed(2).replace(/\.?0+$/,"")}% ${money(ft)} · Soda tax ${(W.sodaTaxRate*100).toFixed(2).replace(/\.?0+$/,"")}% ${money(st)}<br><b>Estimated total: ${money(sub+ft+st)}</b><br><small>${esc(W.priceNote||"")}${unk?` ${unk} item(s) without a price not included.`:""}</small>`;
 $("reset").hidden=!Object.keys(S.removed).length;if(typeof DEV!=="undefined")recipes();}
let undoFn,tt;function toast(m,f){undoFn=f;$("undo").hidden=!f;$("tm").textContent=m;$("toast").style.display="flex";clearTimeout(tt);tt=setTimeout(()=>$("toast").style.display="none",6000);}
$("undo").onclick=()=>{undoFn&&undoFn();$("toast").style.display="none";};

var DEV=localStorage.getItem("grocery-dev")||(Math.random().toString(36).slice(2,10));localStorage.setItem("grocery-dev",DEV);
var SK="grocery-sync:"+W.weekId,SY=JSON.parse(localStorage.getItem(SK)||"null"),SH,Q;
if(SY){SH=SY.sh;Q=SY.q}else{SH={};Q=[];var mt=1000;
 for(var id in S.checked)Q.push({k:"checked",id:id,v:1,ts:mt});for(var id in S.removed)Q.push({k:"removed",id:id,v:1,ts:mt});
 (S.added||[]).forEach(it=>Q.push({k:"added",id:it.id,v:it,ts:mt}));for(var id in S.chosen)Q.push({k:"chosen",id:id,v:S.chosen[id],ts:mt});for(var id in S.cancelled)Q.push({k:"cancelled",id:id,v:1,ts:mt});
 Q.forEach(applyOp);}
function applyOp(p){var m=SH[p.k]||(SH[p.k]={}),c=m[p.id],v=p.v===undefined?null:p.v;if(!c||p.ts>c.ts||(p.ts===c.ts&&JSON.stringify(v)>JSON.stringify(c.v))){m[p.id]={v:v,ts:p.ts};return true}return false}
function rebuild(){var f=k=>{var o={},m=SH[k]||{};for(var id in m)if(m[id].v)o[id]=m[id].v;return o};
 S.recipe=f("recipe");S.checked=f("checked");S.removed=f("removed");S.chosen=f("chosen");S.cancelled=f("cancelled");
 var a=SH.added||{};S.added=Object.keys(a).filter(id=>a[id].v).sort((x,y)=>a[x].ts-a[y].ts).map(id=>Object.assign({},a[id].v,{id:id}));}
var lastTs=0;function now(){var t=Date.now();lastTs=t>lastTs?t:lastTs+1;return lastTs}
function persist(){localStorage.setItem(SK,JSON.stringify({sh:SH,q:Q}));save()}
function op(k,id,v){var p={k:k,id:id,v:v==null?null:v,ts:now()};applyOp(p);Q.push(p);rebuild();persist();flush()}
var syncing=false,syncAgain=false;
async function flush(){if(syncing){syncAgain=true;return}var pin=localStorage.getItem("grocery-pin");if(!pin)return;syncing=true;
 try{var batch=Q.slice(0,300),u=HOOK+"/state"+(batch.length?"/ops":"")+"?week="+encodeURIComponent(W.weekId);
  var r=await fetch(u,batch.length?{method:"POST",headers:{"X-App-Pin":pin,"Content-Type":"application/json"},body:JSON.stringify({ops:batch})}:{headers:{"X-App-Pin":pin},cache:"no-store"});
  if(r.ok){var d=await r.json();Q.splice(0,batch.length);var st=d.state||{},chg=false;
   for(var k in st)for(var id in st[k])if(applyOp({k:k,id:id,v:st[k][id].v,ts:st[k][id].ts}))chg=true;
   Q.forEach(applyOp);var before=JSON.stringify([S.checked,S.removed,S.added,S.chosen,S.cancelled,S.recipe]);rebuild();persist();
   if(before!==JSON.stringify([S.checked,S.removed,S.added,S.chosen,S.cancelled,S.recipe]))render();$("sync")&&($("sync").textContent="Synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));}
  else if($("sync"))$("sync").textContent=r.status==401?"Sync: check PIN":"Sync paused ("+r.status+")";
 }catch(e){$("sync")&&($("sync").textContent="Offline. Changes saved, will sync");}
 syncing=false;if(syncAgain||Q.length&&Q.length>=300){syncAgain=false;setTimeout(flush,200)}}
rebuild();persist();
setInterval(()=>{if(!document.hidden)flush()},10000);addEventListener("focus",flush);addEventListener("online",flush);document.addEventListener("visibilitychange",()=>{if(!document.hidden)flush()});

$("cats").onclick=e=>{const c=e.target.closest("[data-c]"),r=e.target.closest("[data-r]");
 if(c){const id=c.dataset.c;op("checked",id,S.checked[id]?null:1);render();}
 if(r){const id=r.dataset.r,it=items().find(i=>i.id===id);
  if(id.startsWith("u:")){const ov=SH.added&&SH.added[id]&&SH.added[id].v;op("added",id,null);render();toast("Removed "+it.name,()=>{op("added",id,ov||it);render();});}
  else{op("removed",id,1);render();toast("Removed "+it.name,()=>{op("removed",id,null);render();});}}};
$("hide").onclick=()=>{S.hide=!S.hide;save();render()};$("sink").onclick=()=>{S.sink=!S.sink;save();render()};$("mode").onclick=()=>{S.route=!S.route;save();render()};
$("clear").onclick=()=>{if(confirm("Clear all checks?")){const o=Object.keys(S.checked);o.forEach(id=>op("checked",id,null));render();toast("Checks cleared",()=>{o.forEach(id=>op("checked",id,1));render();});}};
$("reset").onclick=()=>{if(confirm("Restore all removed items?")){Object.keys(S.removed).forEach(id=>op("removed",id,null));render();}};
$("add").onsubmit=e=>{e.preventDefault();const p=parseFloat($("ap").value.replace("$",""));
 op("added","u:"+Date.now()+Math.random().toString(36).slice(2,6),{name:$("an").value.trim(),qty:$("aq").value.trim()||1,cat:$("ac").value,list:S.list,price:isNaN(p)?null:p});render();$("an").value=$("aq").value=$("ap").value="";};
function curRecipes(){return nx()?((W.nextWeek&&W.nextWeek.recipes)||[]):(W.recipes||[])}
const rkey=r=>"rm:"+(r.id||r.title);
function recipes(){if(typeof S.recipe==="undefined")S.recipe={};const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");let h="";
 const open=new Set([...document.querySelectorAll("#rlist details[open]")].map(d=>d.dataset.t));
 curRecipes().forEach((r,ix)=>{const rm=S.recipe[rkey(r)];h+=`<details data-t="${esc(r.title)}"${open.has(r.title)?" open":""}${rm?' class="gone"':""}><summary>${esc(r.title)}${rm?' <span class="rpend">· Removal pending</span>':""}</summary><div>
 <div class="rbar"><button class="btn" data-re="${ix}">✎ Edit</button>${rm?`<button class="btn" data-ru="${ix}">Undo removal</button>`:`<button class="btn" data-rr="${ix}">✕ Remove</button>`}</div>
 ${rm?`<p class="rpend">Removal pending${rm.by&&rm.by!==DEV?" (other phone)":""}: ${rm.mode==="own"?"cooking our own":"asked for a suggestion"}${rm.text?": "+esc(rm.text):""}</p>`:""}
 <p class="meta">${esc(r.meta||"")}</p><h3>Ingredients</h3><ul>${li(r.ingredients)}</ul><h3>Steps</h3><ol>${li(r.steps)}</ol>${r.notes?`<h3>Notes</h3><ul>${li(r.notes)}</ul>`:""}</div></details>`});
 if(!nx()&&W.snacks&&W.snacks.length)h+=`<details data-t="_snacks"${open.has("_snacks")?" open":""}><summary>Lunches &amp; Snacks</summary><div><ul>${W.snacks.map(s=>`<li><b>${esc(s.name)}</b>: ${esc(s.desc)} <i>${esc(s.carbs)}</i></li>`).join("")}</ul></div></details>`;
 if(!nx()&&W.prep&&W.prep.length)h+=`<details data-t="_prep"${open.has("_prep")?" open":""}><summary>Prep Checklist</summary><div><ul>${li(W.prep)}</ul></div></details>`;
 if(!h)h='<p class="empty">No recipes for this list yet</p>';
 $("rlist").innerHTML=h;renderRPicks();}
const tab=t=>{["list","recipes","chat"].forEach((x,i)=>{$(x).hidden=x!==t;$(["tL","tR","tC"][i]).classList.toggle("on",x===t)});scrollTo(0,0)};
$("tL").onclick=()=>tab("list");$("tR").onclick=()=>tab("recipes");$("tC").onclick=()=>{tab("chat");renderMsgs()};
render();recipes();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});


function modal(html){$("mbody").innerHTML=html;$("modal").style.display="flex";}function closeM(){$("modal").style.display="none";$("mbody").innerHTML="";}
$("modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-mx]"))closeM();};
var mAct=null;
$("mbody").addEventListener("click",async e=>{const b=e.target.closest("[data-go]");if(!b||b.disabled||!mAct)return;b.disabled=true;await mAct(b.dataset.go);});
$("rlist").onclick=e=>{const E=e.target.closest("[data-re]"),R=e.target.closest("[data-rr]"),U=e.target.closest("[data-ru]");const L=S.list;
 if(E){const r=curRecipes()[+E.dataset.re];modal(`<b>Edit: ${esc(r.title)}</b><label>What would you like changed?<textarea id="mt"></textarea></label><div class="ls"><button class="btn" data-mx>Close</button><button class="btn on" data-go="edit">Send</button></div>`);
  mAct=async()=>{const t=$("mt").value.trim();if(!t){toast("Type what to change");$("mbody").querySelector("[data-go]").disabled=false;return}closeM();await send({type:"recipe-edit",recipeId:r.id||r.title,name:r.title,text:t,list:L},"Edit recipe "+r.title+": "+t,"recipe-edit:"+(r.id||r.title)+":"+Date.now());};}
 if(R){const r=curRecipes()[+R.dataset.rr];if(!confirm("Remove "+r.title+"?"))return;
  modal(`<b>Remove: ${esc(r.title)}</b><p>What instead?</p><label>Suggest something else. Any ideas or cravings? (optional)<textarea id="ms"></textarea></label><button class="btn on" data-go="suggest">Suggest something else</button><label>We'll cook our own. What do you plan to make? (optional)<textarea id="mo"></textarea></label><button class="btn" data-go="own">We'll cook our own</button><button class="btn" data-mx>Cancel</button>`);
  mAct=async mode=>{const t=($(mode==="own"?"mo":"ms").value||"").trim();closeM();op("recipe",rkey(r),{mode:mode,text:t,by:DEV});render();
   await send({type:"recipe-remove",recipe:r.id||r.title,name:r.title,mode:mode,text:t,list:L},"Remove recipe "+r.title+(mode==="own"?" (cooking our own)":" (suggest another)")+(t?": "+t:""),"recipe-remove:"+(r.id||r.title));};}
